# Version v3 — Optimized tool declarations with clear boundaries, parameter constraints, and safety guidelines.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Yêu cầu người dùng cung cấp thêm thông tin còn thiếu (mã asset, mã nhân viên, lựa chọn môi trường) hoặc xin xác nhận trước khi thực hiện hành động ghi (như tạo ticket)."
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "Nội dung câu hỏi hoặc yêu cầu xác nhận gửi đến người dùng."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: "Kiểu phản hồi mong đợi: 'text' khi thiếu mã asset/nhân viên, 'yes_no' khi xin xác nhận hành động ghi/ticket, 'choice' khi người dùng cần chọn giữa các lựa chọn."
        options:
          type: array
          default: []
          items: {type: string}
          description: "Danh sách các lựa chọn khi response_type là 'choice' (ví dụ ['production', 'staging'])."
      required: [question]

  - name: search_kb
    description: "Tìm kiếm hướng dẫn kỹ thuật, cách cài đặt, cấu hình hoặc troubleshooting trong Knowledge Base nội bộ. Không dùng để tra cứu chính sách/quy định công ty hoặc kiểm tra trạng thái dịch vụ live."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Từ khóa hoặc mô tả sự cố kỹ thuật cần tra cứu hướng dẫn."
        category:
          type: string
          enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room]
          default: "all"
          description: "Chuyên mục hướng dẫn tương ứng với sự cố."
        top_k:
          type: integer
          default: 3
          description: "Số lượng bài viết hướng dẫn tối đa cần lấy."
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái vận hành hiện tại của một dịch vụ dùng chung trong công ty (VPN, Email, SSO, Wi-Fi, Printing). Không dùng để kiểm tra thiết bị cá nhân của người dùng."
    parameters:
      type: object
      properties:
        service:
          type: string
          enum: [vpn, email, sso, wifi, printing]
          description: "Tên dịch vụ dùng chung cần kiểm tra."
        environment:
          type: string
          enum: [production, staging]
          default: "production"
          description: "Môi trường triển khai của dịch vụ (mặc định là production)."
      required: [service]

  - name: inspect_device
    description: "Đọc thông tin tài sản phần cứng và diagnostic snapshot của một thiết bị cụ thể trong công ty theo mã tài sản asset_id."
    parameters:
      type: object
      properties:
        asset_id:
          type: string
          description: "Mã tài sản định danh thiết bị (ví dụ LT-204, LT-318, DT-031, PR-404)."
        check:
          type: string
          enum: [all, network, vpn, security, hardware, software]
          default: "all"
          description: "Nhóm thông số hoặc chẩn đoán cần kiểm tra trên thiết bị."
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu hồ sơ nhân viên trong danh bạ hỗ trợ và danh sách các thiết bị được cấp theo mã nhân viên employee_id."
    parameters:
      type: object
      properties:
        employee_id:
          type: string
          description: "Mã định danh nhân viên (ví dụ EMP-1003, EMP-1007)."
      required: [employee_id]

  - name: format_incident_report
    description: "Định dạng các kết quả/findings đã có sẵn thành báo cáo sự cố chuẩn hóa (Markdown). Chỉ dùng khi đã có findings; không tự kiểm tra lại thiết bị nếu chỉ được yêu cầu format."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Danh sách các kết quả đã thu thập từ trước."
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template:
          type: string
          enum: [brief, technical, handoff]
          default: "brief"
          description: "Mẫu định dạng báo cáo: brief (tóm tắt), technical (chi tiết kỹ thuật), handoff (bàn giao)."
        incident_title:
          type: string
          default: "IT incident"
          description: "Tiêu đề của báo cáo sự cố."
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web thông qua Tavily Search. Chỉ truyền manufacturer và model công khai; tuyệt đối KHÔNG truyền asset ID, employee ID, hostname, serial hoặc log nội bộ ra ngoài."
    parameters:
      type: object
      properties:
        manufacturer:
          type: string
          description: "Hãng sản xuất thiết bị (ví dụ Lenovo, Apple, Dell)."
        model:
          type: string
          description: "Tên model sản phẩm công khai (ví dụ ThinkPad T14 Gen 4, MacBook Pro 14)."
        query_type:
          type: string
          enum: [specs, drivers, support, compatibility]
          default: "support"
          description: "Loại thông tin công khai cần tìm kiếm."
        max_results:
          type: integer
          default: 3
          description: "Số lượng kết quả tìm kiếm tối đa (từ 1 đến 5)."
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tra cứu các quy định, chính sách và tiêu chuẩn IT nội bộ của Northstar Labs. Dùng khi người dùng hỏi về quy định, quyền truy cập, bảo mật hoặc quy trình ticket."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Nội dung hoặc câu hỏi liên quan đến chính sách cần tra cứu."
        policy_area:
          type: string
          enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing]
          default: "all"
          description: "Phạm vi chính sách liên quan."
        top_k:
          type: integer
          default: 3
          description: "Số lượng điều khoản chính sách tối đa cần lấy."
      required: [query]

  - name: create_ticket
    description: "Tạo ticket hỗ trợ mới trên hệ thống IT. CHỈ ĐƯỢC GỌI khi người dùng đã xác nhận rõ ràng trong hội thoại (confirmed=true). Tuyệt đối không bao gồm password, token, OTP, API key trong summary."
    parameters:
      type: object
      properties:
        summary:
          type: string
          default: ""
          description: "Tóm tắt ngắn gọn về sự cố (tuyệt đối không chứa thông tin nhạy cảm/mật khẩu)."
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: "medium"
          description: "Mức độ ưu tiên của ticket sự cố."
        asset_id:
          type: string
          default: ""
          description: "Mã tài sản liên quan đến sự cố (nếu có, ví dụ LT-204)."
        confirmed:
          type: boolean
          default: false
          description: "Đã có xác nhận rõ ràng từ người dùng (bắt buộc là true để tạo ticket)."
      required: [summary]
